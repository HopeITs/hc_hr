;font-weight:700;height:28px;border-color:#6D6E71}\n.pf .num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:plaintext}\n.pf-sign{display:flex;justify-content:space-between;gap:20px;margin-top:auto;font-size:12px}\n.pf-sign div{flex:1;border-top:1px solid #6D6E71;padding-top:6px;text-align:center;margin-top:26px}\n.pf h2{margin:0;font:800 17px Inter,'Noto Sans Arabic',sans-serif;direction:ltr;text-align:start}\n.pf-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}\n.pf-kpi div{border:1px solid #6D6E71;border-radius:6px;padding:10px 8px;text-align:center}\n.pf-kpi b{display:block;font:800 22px Inter,sans-serif;font-variant-numeric:tabular-nums;direction:ltr}\n.pf-kpi span{font-size:11px;color:#414042}\n.pf-note{font-size:11px;color:#6D6E71;line-height:1.6}\n<\/style><style>body{margin:0}.ck{width:18px;height:18px;border-radius:5px;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:#fff}.ck.on{background:var(--ink);border-color:var(--ink);color:#fff}.ck .ic{width:12px;height:12px}<\/style><style>.hs{cursor:pointer}.hs:hover{outline:2px solid #BE1F24;outline-offset:2px}<\/style><\/head><body>\n\n<div class=\"app\" style=\"width:1000px;height:980px\">\n<div class=\"side\" style=\"width:196px\">\n<div class=\"brand\"><i><\/i>HC-HR<\/div>\n<span class=\"ni\"><i class=\"ic i-grid\"><\/i>Dashboard<\/span>\n<span class=\"ni\"><i class=\"ic i-user\"><\/i>Employees<\/span>\n<span class=\"ni\"><i class=\"ic i-file\"><\/i>Contracts<\/span>\n<span class=\"ni\"><i class=\"ic i-cal\"><\/i>Leaves<\/span>\n<span class=\"ni on\"><i class=\"ic i-clock\"><\/i>Attendance<\/span>\n<span class=\"ni sub\">Upload<\/span>\n<span class=\"ni sub\">Timesheets<\/span>\n<span class=\"ni sub on\">Print<\/span>\n<\/div>\n<div class=\"main\">\n<div class=\"top\"><h1>Print timesheets<\/h1><div style=\"display:flex;gap:10px\"><span class=\"inp\"><i class=\"ic i-bld\"><\/i>Damascus center<\/span><span class=\"inp\"><i class=\"ic i-cal\"><\/i>September 2026<\/span><\/div><\/div>\n<div class=\"pg\">\n\n<div class=\"row\" style=\"gap:18px;align-items:flex-start\">\n<div class=\"card\" style=\"flex:1.2;padding:12px 14px\">\n<div class=\"card-h\" style=\"margin-bottom:8px\"><h3>Who to print<\/h3><span class=\"sm faint\">12 selected<\/span><\/div>\n<table class=\"tbl tight\">\n<thead><tr><th style=\"width:26px\"><span class=\"ck on\"><i class=\"ic i-check\"><\/i><\/span><\/th><th>Volunteer<\/th><th>ID<\/th><th>State<\/th><\/tr><\/thead>\n<tbody class=\"sm\">\n<tr><td><span class=\"ck on\"><i class=\"ic i-check\"><\/i><\/span><\/td><td>Rami Haddad<\/td><td class=\"num\">8<\/td><td><span class=\"st st-done\"><i class=\"ic i-check\"><\/i>Ready<\/span><\/td><\/tr>\n<tr><td><span class=\"ck on\"><i class=\"ic i-check\"><\/i><\/span><\/td><td>Fadi Mansour<\/td><td class=\"num\">26<\/td><td><span class=\"st st-need\"><i class=\"ic i-alert\"><\/i>1 to decide<\/span><\/td><\/tr>\n<tr><td><span class=\"ck on\"><i class=\"ic i-check\"><\/i><\/span><\/td><td>Noor Ibrahim<\/td><td class=\"num\">34<\/td><td><span class=\"st st-done\"><i class=\"ic i-check\"><\/i>Ready<\/span><\/td><\/tr>\n<tr><td><span class=\"ck on\"><i class=\"ic i-check\"><\/i><\/span><\/td><td>Hasan Aziz<\/td><td class=\"num\">36<\/td><td><span class=\"st st-need\"><i class=\"ic i-alert\"><\/i>1 to decide<\/span><\/td><\/tr>\n<tr><td><span class=\"ck on\"><i class=\"ic i-check\"><\/i><\/span><\/td><td>Maya Saleh<\/td><td class=\"num\">38<\/td><td><span class=\"st st-late\"><i class=\"ic i-alert\"><\/i>15 to decide<\/span><\/td><\/tr>\n<tr><td><span class=\"ck on\"><i class=\"ic i-check\"><\/i><\/span><\/td><td>Hiba Zaid<\/td><td class=\"num\">204<\/td><td><span class=\"st st-need\"><i class=\"ic i-alert\"><\/i>2 to decide<\/span><\/td><\/tr>\n<tr><td class=\"faint\" colspan=\"4\">… 6 more<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n\n<div style=\"flex:1;display:flex;flex-direction:column;gap:16px\">\n<div class=\"card\">\n<div class=\"card-h\"><h3>What to print<\/h3><\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px\" class=\"sm\">\n<div class=\"who\"><span class=\"ck on\"><i class=\"ic i-check\"><\/i><\/span><div><b>Page 1: the timesheet<\/b><div class=\"muted\">your form, filled<\/div><\/div><\/div>\n<div class=\"who\"><span class=\"ck on\"><i class=\"ic i-check\"><\/i><\/span><div><b>Page 2: monthly summary and balances<\/b><\/div><\/div>\n<div class=\"who\"><span class=\"ck\"><\/span><div><b>Arrival and leaving times<\/b><div class=\"muted\">off, as you asked<\/div><\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"card\">\n<div class=\"card-h\"><h3>Output<\/h3><\/div>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span class=\"chip on\" style=\"height:34px\">One PDF for the whole center, 24 pages<\/span>\n<span class=\"chip\" style=\"height:34px\">One PDF per volunteer<\/span>\n<span class=\"chip\" style=\"height:34px\">Excel on your template, one file each<\/span>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n\n<div class=\"card\" style=\"display:flex;gap:16px;align-items:center\">\n<span class=\"st st-late\"><i class=\"ic i-alert\"><\/i>46 days to decide<\/span>\n<div class=\"sm\" style=\"flex:1\">The timesheets can be printed now as a <b>draft<\/b>, with the word DRAFT on each page. Final copies need every day answered.<\/div>\n<button type=\"button\" class=\"btn btn-o\">Go through them<\/button>\n<button type=\"button\" class=\"btn btn-p\"><i class=\"ic i-file\"><\/i>Print draft<\/button>\n<\/div>\n\n<div class=\"card\">\n<div class=\"card-h\"><h3>After it is signed<\/h3><\/div>\n<div class=\"row\" style=\"gap:14px\">\n<div class=\"who\" style=\"flex:1;align-items:flex-start\"><span class=\"st st-wait num\">1<\/span><div class=\"sm\"><b>Print final<\/b><div class=\"muted\">only when nothing is left to decide<\/div><\/div><\/div>\n<div class=\"who\" style=\"flex:1;align-items:flex-start\"><span class=\"st st-wait num\">2<\/span><div class=\"sm\"><b>Three signatures on paper<\/b><div class=\"muted\">volunteer, supervisor, HR manager<\/div><\/div><\/div>\n<div class=\"who\" style=\"flex:1;align-items:flex-start\"><span class=\"st st-wait num\">3<\/span><div class=\"sm\"><b>Attach the scan and lock<\/b><div class=\"muted\">the month can no longer change<\/div><\/div><\/div>\n<\/div>\n<\/div>\n\n<div class=\"dq\"><span class=\"tg\">Decide<\/span><p class=\"sm\">Is a draft print useful, or must the system refuse to print until every day has an answer? Should HR attach the signed scan to the month, to keep the proof in one place?<\/p><\/div>\n\n<\/div>\n<\/div>\n<\/div>\n<\/body><\/html>"}];
// Words on a menu item or button -> the screen it leads to.
const GO={"upload":0,"timesheets":1,"print":6,"overtime rule":3,"continue to timesheets":1,"go through them":2,"print 12 timesheets":6,"print draft":6,"choose another file":0,"attendance":1}
;
let cur=0,timer=null,t0=0;
const $=id=>document.getElementById(id);
const nav=$('nav');
B.forEach((b,i)=>{const e=document.createElement('button');e.innerHTML='<b>'+String(i).padStart(2,'0')+'</b>'+b.title.replace(/^\d+\s*/,'');e.onclick=()=>{stop();show(i)};nav.appendChild(e)});
function fit(){const s=$('stage'),b=B[cur],f=$('frame');const k=Math.min((s.clientWidth-24)/b.w,(s.clientHeight-24)/b.h);f.style.width=b.w+'px';f.style.height=b.h+'px';f.style.transform='scale('+k+') translate(-50%,-50%)'}
function show(i){cur=Math.max(0,Math.min(B.length-1,i));const b=B[cur];$('fr').srcdoc=b.html;$('cap').textContent=b.caption;$('count').textContent=(cur+1)+' / '+B.length;$('prev').disabled=cur===0;$('next').disabled=cur===B.length-1;[...nav.children].forEach((e,n)=>e.classList.toggle('on',n===cur));fit()}
$('fr').addEventListener('load',()=>{const d=$('fr').contentDocument;if(!d)return;d.querySelectorAll('.ni,.btn,.tab,.chip').forEach(e=>{const t=e.textContent.trim().replace(/\s+/g,' ').replace(/\s*\d+$/,'').toLowerCase();if(GO[t]!==undefined&&GO[t]!==cur)e.classList.add('hs')});d.addEventListener('click',ev=>{const e=ev.target.closest('.hs');if(!e)return;const t=e.textContent.trim().replace(/\s+/g,' ').replace(/\s*\d+$/,'').toLowerCase();stop();show(GO[t])})});
function stop(){clearInterval(timer);timer=null;$('play').textContent='Play tour';$('bar').style.width='0'}
const DUR=8000;
function play(){if(timer){stop();return}if(cur===B.length-1)show(0);$('play').textContent='Pause';t0=Date.now();timer=setInterval(()=>{const p=(Date.now()-t0)/DUR;$('bar').style.width=Math.min(100,p*100)+'%';if(p>=1){if(cur>=B.length-1){stop();return}t0=Date.now();show(cur+1)}},100)}
$('prev').onclick=()=>{stop();show(cur-1)};$('next').onclick=()=>{stop();show(cur+1)};$('play').onclick=play;
$('full').onclick=()=>{document.body.classList.toggle('fs');if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();else document.exitFullscreen();setTimeout(fit,150)};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('fs');setTimeout(fit,150)});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();show(cur+1)}else if(e.key==='ArrowLeft'){stop();show(cur-1)}else if(e.key===' '){e.preventDefault();play()}else if(e.key==='f'||e.key==='F'){$('full').click()}else if(e.key==='Home'){stop();show(0)}else if(e.key==='End'){stop();show(B.length-1)}});
addEventListener('resize',fit);
show(0);
</script>
