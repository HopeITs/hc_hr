<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الاستبيانات والشكاوى — مركز الرجاء المسيحي</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#BE1F24;--red-h:#a81b20;--ink:#414042;--ink2:#6D6E71;--ink3:#939598;--line:#BCBEC0;--ls:#E6E7E8;--soft:#F3F3F4;--card:#fff;--bg:#F3F3F4;--on-ink:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Noto Sans Arabic",Tahoma,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.6;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.skip{position:absolute;inset-inline-start:8px;top:-60px;background:var(--ink);color:var(--on-ink);padding:8px 14px;border-radius:8px;z-index:30}
.skip:focus{top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--ls);flex:none;position:relative;z-index:5}
.logo{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{width:12px;height:12px;border-radius:3px;background:var(--red);display:inline-block}
.logo small{font-weight:500;color:var(--ink2);font-size:13px}
.top .sp{flex:1}
#menuBtn{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink2);min-height:36px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.who{display:flex;align-items:center;gap:10px;line-height:1.25}
.av{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.who b{display:block;font-size:14px}.who span{font-size:12px;color:var(--ink2)}
.layout{flex:1;display:flex;min-height:0}
nav{width:240px;flex:none;background:var(--card);border-inline-end:1px solid var(--ls);padding:12px 8px;overflow:auto}
nav .grp{font-size:12px;color:var(--ink3);padding:12px 12px 4px;font-weight:700}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:start;border:0;background:none;padding:10px 12px;border-radius:9px;cursor:pointer;color:var(--ink2);font-weight:500;font-size:15px;min-height:42px}
nav button:hover{background:var(--soft)}
nav button[aria-current=page]{background:var(--soft);color:var(--ink);font-weight:700;box-shadow:inset -3px 0 0 var(--red)}
nav .badge{margin-inline-start:auto}
main{flex:1;min-width:0;overflow:auto;padding:24px clamp(16px,3vw,36px) 60px;scroll-behavior:smooth}
main:focus{outline:none}
.wrap{max-width:1100px;margin:0 auto;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:clamp(24px,3.4vw,32px);font-weight:800;margin:0 0 4px;line-height:1.3;text-wrap:balance}
h2{font-size:18px;font-weight:700;margin:0 0 12px}
h1:focus{outline:none}
.crumb{font-size:13px;color:var(--ink3);margin-bottom:6px}
.sub{color:var(--ink2);margin:0 0 20px;font-size:15px;max-width:68ch}
/* atoms */
.card{background:var(--card);border:1px solid var(--ls);border-radius:14px;padding:18px}
.card.link{cursor:pointer;transition:border-color .15s,transform .15s;text-align:start;width:100%}
.card.link:hover{border-color:var(--ink);transform:translateY(-2px)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.kpi .n{font-size:34px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--ink2);font-size:14px}
.kpi .d{font-size:13px;color:var(--ink2);margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn.p{background:var(--red);border-color:var(--red);color:#fff}.btn.p:hover{background:var(--red-h)}
.btn.q{border-color:transparent;background:none;color:var(--ink2)}
.btn.sm{height:34px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
label.f{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input[type=text],input[type=search],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);min-height:42px}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--ls);outline:none}
textarea{min-height:120px;resize:vertical}
.hint{font-size:14px;color:var(--ink2)}
.req{color:var(--red)}
.err{color:var(--red);font-size:13px;margin-top:4px}
hr{border:0;border-top:1px solid var(--ls);margin:16px 0}
a{color:var(--ink)}
/* status = icon + words + fill shape (no hue) */
.st{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.st.prog{background:var(--ink);color:var(--on-ink)}
.st.done{background:var(--ls);color:var(--ink2)}
.st.you{border:1.5px solid var(--ink);color:var(--ink)}
.st.wait{background:var(--card);border:1px solid var(--line);color:var(--ink2)}
.st.late{background:var(--red);color:#fff}
.st.rush{border:1.5px solid var(--red);color:var(--red)}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--ls);font-size:12px;font-weight:600;color:var(--ink2)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center}
/* tables */
.tbl{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:13px;color:var(--ink2);text-align:start;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--ls);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--ls);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
tr.click:focus-visible{outline-offset:-2px}
tr.sel td{background:var(--soft)}tr.sel td:first-child{box-shadow:inset -3px 0 0 var(--red)}
.num{font-variant-numeric:tabular-nums}
/* bars */
.bar{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.bar .t{height:12px;background:var(--ls);border-radius:99px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .6s}
.bar.low .t i{background:var(--red)}
.bar .v{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.dl{font-size:12px;color:var(--ink2)}
/* rating */
.scale{display:flex;gap:8px;flex-wrap:wrap}
.scale button{width:52px;height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;font-size:17px;transition:transform .1s}
.scale button:hover{border-color:var(--ink);transform:translateY(-2px)}
.scale button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.scale.n button{width:44px;height:44px;font-size:15px}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-top:6px}
.kbd{font-size:12px;color:var(--ink3)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;margin-bottom:8px;width:100%;text-align:start;background:var(--card)}
.opt:hover{border-color:var(--ink)}
.opt[aria-checked=true]{border-color:var(--ink);background:var(--soft)}
.opt .rad{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:5px;flex:none;display:grid;place-items:center}
.opt[aria-checked=true] .rad{border-color:var(--ink)}.opt[aria-checked=true] .rad::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
.opt b{display:block}
.opt span.d{font-size:14px;color:var(--ink2)}
.prog-bar{height:6px;background:var(--ls);border-radius:99px;overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--red);transition:width .3s}
/* stepper */
.steps{display:flex;gap:6px;margin:0 0 18px;padding:0;list-style:none}
.steps li{flex:1;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink3);font-weight:600}
.steps li span{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none;background:var(--card)}
.steps li.cur{color:var(--ink)}.steps li.cur span{background:var(--red);border-color:var(--red);color:#fff}
.steps li.ok{color:var(--ink2)}.steps li.ok span{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.steps li::after{content:"";flex:1;height:2px;background:var(--ls);border-radius:2px}
.steps li:last-child::after{display:none}
@media(max-width:560px){.steps li b{display:none}.steps li.cur b{display:inline}}
/* builder */
.q{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--ls);border-radius:12px;background:var(--card);margin-bottom:10px;animation:in .2s}
.q:focus-within{border-color:var(--ink3)}
.q .no{width:28px;height:28px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.q .body{flex:1;min-width:0}
.q .acts{display:flex;gap:2px}
.q .acts button{border:0;background:none;width:34px;height:34px;border-radius:8px;cursor:pointer;color:var(--ink2)}
.q .acts button:hover:not(:disabled){background:var(--soft);color:var(--ink)}
.q .acts button:disabled{opacity:.3;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px dashed var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-size:14px;cursor:pointer;font-weight:600;color:var(--ink2)}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--on-ink);border:1px solid var(--ink)}
.savebar{position:sticky;bottom:0;margin-top:16px;background:var(--card);border:1px solid var(--ls);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 -6px 18px rgba(0,0,0,.06)}
/* split detail */
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.split>.stick{position:sticky;top:0}
@media(max-width:1000px){.split{grid-template-columns:1fr}.split>.stick{position:static}}
.tl{position:relative;padding-inline-start:22px;margin:0;list-style:none}
.tl::before{content:"";position:absolute;inset-inline-start:6px;top:6px;bottom:6px;width:2px;background:var(--ls)}
.tl li{position:relative;margin-bottom:14px;font-size:14px}
.tl li::before{content:"";position:absolute;inset-inline-start:-21px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--ink3)}
.tl li.now::before{background:var(--red);border-color:var(--red)}
.tl small{display:block;color:var(--ink3)}
.msg{padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:14px;max-width:88%}
.msg.hr{background:var(--soft)}
.msg.me{background:var(--ink);color:var(--on-ink);margin-inline-start:auto}
.msg small{display:block;opacity:.7;font-size:12px}
.note{background:var(--soft);border-inline-start:3px solid var(--ink);padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
.note.r{border-inline-start-color:var(--red)}
.note .i{margin-top:5px}
.empty{display:grid;place-items:center;text-align:center;padding:40px 16px;border:1.5px dashed var(--line);border-radius:14px;color:var(--ink2);gap:6px;background:var(--card)}
.empty svg{width:28px;height:28px;color:var(--ink3)}
.code{font-family:ui-monospace,Consolas,monospace;font-size:28px;font-weight:800;letter-spacing:2px;direction:ltr;background:var(--soft);padding:10px 18px;border-radius:12px;display:inline-block;user-select:all}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,10px);background:var(--ink);color:var(--on-ink);padding:10px 18px;border-radius:99px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
dialog{border:0;border-radius:16px;padding:22px;max-width:440px;width:calc(100% - 32px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(30,30,30,.5)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hello{display:flex;gap:16px;align-items:center;margin-bottom:20px}
.hello .av{width:56px;height:56px;font-size:20px}
.big-ic{width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;margin:0 auto 12px}
.big-ic svg{width:28px;height:28px}
.cta{display:flex;gap:14px;align-items:flex-start}
.cta .ci{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}
.cta .ci svg{width:22px;height:22px}
.cta.main .ci{background:var(--red);color:#fff}
@media(max-width:820px){
  #menuBtn{display:inline-flex}
  nav{position:fixed;inset-block:0;inset-inline-start:0;z-index:20;transform:translateX(100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.3);padding-top:64px}
  nav.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(30,30,30,.4);z-index:15}
  .bar{grid-template-columns:100px 1fr 56px}
  .logo small,.who span,.who b{display:none}
  .top{padding:8px 12px}
}
@media(max-width:480px){.seg button{padding:6px 8px;font-size:13px}.logo{font-size:15px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(prefers-color-scheme:dark){
  :root{--ink:#E6E7E8;--ink2:#BCBEC0;--ink3:#939598;--line:#58595b;--ls:#3a393b;--soft:#2f2e30;--card:#232224;--bg:#1a191a;--on-ink:#232224}
}
</style>
</head>
<body>
<a class="skip" href="#main">تخطَّ إلى المحتوى</a>
<header class="top">
  <button class="btn sm" id="menuBtn" aria-label="القائمة" aria-expanded="false"></button>
  <div class="logo"><i></i> مركز الرجاء المسيحي <small>· الموارد البشرية</small></div>
  <span class="sp"></span>
  <div class="seg" id="roleSeg" role="group" aria-label="العرض كـ">
    <button data-r="hr" aria-pressed="true">الموارد البشرية</button>
    <button data-r="vol" aria-pressed="false">متطوع / موظف</button>
  </div>
  <div class="who" id="who"></div>
</header>
<div class="layout">
  <nav id="nav" aria-label="التنقل الرئيسي"></nav>
  <main id="main" tabindex="-1"><div class="wrap" id="view"></div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script>
/* ---------- helpers ---------- */
const ICON={
 home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
 edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
 chart:'<path d="M3 3v18h18M7 15v-4M12 15V7M17 15v-6"/>',
 inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2M5.5 5h13L22 12v6a2 2 0 01-2 2H4a2 2 0 01-2-2v-6z"/>',
 form:'<path d="M9 11l3 3 8-8M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V5a2 2 0 012-2h9"/>',
 flag:'<path d="M4 22V4M4 4h14l-2 4 2 4H4"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
 up:'<path d="M18 15l-6-6-6 6"/>',down:'<path d="M6 9l6 6 6-6"/>',x:'<path d="M18 6L6 18M6 6l12 12"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',check:'<path d="M20 6L9 17l-5-5"/>',
 alert:'<path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/>',
 eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>',
 clip:'<path d="M21 12l-8.5 8.5a5 5 0 01-7-7L14 5a3.5 3.5 0 015 5l-8.5 8.5a2 2 0 01-3-3L15 8"/>',
 send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',
 menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/>',
 arrow:'<path d="M19 12H5M12 19l-7-7 7-7"/>',download:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',
};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]||''}</svg>`;
const $=(s,r=document)=>r.querySelector(s);
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arN=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const status=k=>{
 const m={
  new:['you','alert','جديدة — بانتظارك'],review:['prog','search','قيد الدراسة'],inv:['prog','eye','تحقيق'],
  wait:['wait','clock','بانتظار المشتكي'],closed:['done','check','مغلقة'],late:['late','clock','متأخرة'],rush:['rush','alert','عاجلة'],
 }[k];
 return `<span class="st ${m[0]}">${ic(m[1])}${m[2]}</span>`;
};
const USERS={hr:{n:'سارة',full:'سارة — HR سوريا',role:'الموارد البشرية · سوريا',init:'س'},vol:{n:'لانا',full:'لانا عبدو',role:'متطوعة · حلب',init:'ل'}};

/* ---------- data ---------- */
const CITIES=['دمشق','حلب','حمص','اللاذقية','طرطوس'];
const SENS=['مخالفة مالية أو فساد','تحرش أو تمييز أو تنمّر','حماية وسلامة (Safeguarding)'];
const S={
 role:'hr',view:'dash',
 questions:[
  {id:1,type:'rating',text:'أشعر أن مهامي واضحة ومناسبة لمهاراتي',topic:'الدور والمهام'},
  {id:2,type:'rating',text:'مديري المباشر يدعمني ويقدّر جهدي',topic:'المدير المباشر'},
  {id:3,type:'rating',text:'أشعر بالأمان في موقع العمل وفي طريقي إليه',topic:'السلامة'},
  {id:4,type:'enps',text:'ما احتمال أن تنصح صديقاً بالانضمام إلى مركز الرجاء المسيحي؟',topic:'eNPS'},
  {id:5,type:'text',text:'ما الشيء الواحد الذي لو تغيّر لتحسّنت تجربتك؟',topic:'مفتوح'},
 ],
 settings:{anon:'anon',threshold:5,freq:'monthly',cities:['all'],name:'نبضة شهرية — تشرين الثاني 2026'},

}

}

function dirty(){const m=$('#dirtyMsg');if(m)m.textContent=m.textContent.replace(/^[^·]+/,'● تغييرات غير محفوظة ')}
function mv(i,d){const j=i+d;[S.questions[i],S.questions[j]]=[S.questions[j],S.questions[i]];S.dirty=true;render()}
function addQ(type,text,topic){S.questions.push({id:Date.now(),type,text:text||'سؤال جديد — اكتب نصه هنا',topic:topic||'عام'});S.dirty=true;render();const qs=document.querySelectorAll('.q input');const l=qs[qs.length-1];if(l){l.focus();l.select()}}
function delQ(i){const q=S.questions.splice(i,1)[0];S.dirty=true;render();toast('حُذف السؤال');}
function togCity(c){const a=S.settings.cities;if(c==='all'){S.settings.cities=['all']}else{S.settings.cities=a.filter(x=>x!=='all');const k=S.settings.cities.indexOf(c);k>=0?S.settings.cities.splice(k,1):S.settings.cities.push(c);if(!S.settings.cities.length)S.settings.cities=['all']}S.dirty=true;render()}
function launch(){ask(`<h2>إرسال الاستبيان؟</h2><p>سيصل إلى <b>${arN(272)}</b> شخصاً (${S.settings.cities.includes('all')?'كل المدن':S.settings.cities.join('، ')}). بعد الإرسال لا يمكن تعديل الأسئلة، فقط إيقاف الاستبيان.</p>`,()=>{S.dirty=false;render();toast('تمت الجدولة — أول إرسال غداً ٩:٠٠ صباحاً')},'إرسال')}

/* ---------- HR: results ---------- */
V.results=()=>{
 const f=S.cityFilter,d=f==='all'?S.responses.total:S.responses[f],th=S.settings.threshold,locked=d.n<th;
 const e=d.enps,score=e.p-e.d;
 const cm=S.comments.filter(c=>f==='all'||c.c===f);
 const pend=S.comments.filter(c=>!c.rev).length;
 return `
 ${head('الاستبيانات','النتائج',`${esc(S.settings.name)} — مجمّعة فقط، لا يظهر اسم أي مجيب.`,`<button class="btn" onclick="toast('جارٍ تجهيز الملف…')">${ic('download')}تصدير</button>`)}
 <div class="row" style="margin-bottom:16px">
  <label class="f" for="cf" style="margin:0">المدينة</label>
  <select id="cf" style="width:auto" onchange="S.cityFilter=this.value;render()"><option value="all">كل المدن</option>${CITIES.map(c=>`<option ${f===c?'selected':''}>${c}</option>`).join('')}</select>
  <span class="hint">الردود: <b class="num">${arN(d.n)}</b> · الحد الأدنى للعرض: <b class="num">${arN(th)}</b></span>
 </div>
 ${locked?empty('lock','النتائج مخفية',`عدد الردود (${arN(d.n)}) أقل من الحد الأدنى (${arN(th)}) — حماية لهوية المجيبين.`):`
 <div class="grid g2">
  <div class="card"><h2>المحاور (من ٥)</h2>${barsHtml(d.topics,true)}<p class="hint">الشريط الأحمر: أقل من ٣٫٣ ويحتاج متابعة. الأسهم: التغيّر عن الشهر الماضي.</p></div>
  <div class="card"><h2>eNPS</h2>
   <div class="row" style="align-items:flex-end"><div class="kpi"><div class="n num">${score>0?'+':''}${arN(score)}</div></div><span class="hint">مروّجون − منتقدون</span></div>
   <div style="display:flex;height:18px;border-radius:99px;overflow:hidden;margin:12px 0;background:var(--ls)" role="img" aria-label="مروّجون ${e.p} محايدون ${e.pa} منتقدون ${e.d}">
    <i style="width:${e.d}%;background:var(--red)"></i><i style="width:${e.pa}%;background:var(--ink3)"></i><i style="width:${e.p}%;background:var(--ink)"></i></div>
   <div class="row sb hint"><span>منتقدون ${arN(e.d)}٪</span><span>محايدون ${arN(e.pa)}٪</span><span>مروّجون ${arN(e.p)}٪</span></div>
   <hr><h2>مقارنة المدن — الراتب والدفع</h2>
   ${CITIES.filter(c=>S.responses[c].n>=th).map(c=>{const v=S.responses[c].topics['الراتب والدفع'][0];return `<div class="bar ${v<2.8?'low':''}"><span>${c}</span><span class="t"><i style="width:${v/5*100}%"></i></span><span class="v"><b class="num">${arN(v.toFixed(1))}</b></span></div>`}).join('')}
   <p class="hint">طرطوس غير معروضة: ${arN(S.responses['طرطوس'].n)} ردود فقط.</p>
  </div>
 </div>
 <div class="card" style="margin-top:16px"><div class="row sb"><h2 style="margin:0">التعليقات الحرة</h2>${pend?`<span class="st you">${ic('alert')}${arN(pend)} تحتاج حجب أسماء</span>`:''}</div>
  <p class="hint">يراجعها HR ويحجب الأسماء قبل أن تصل إلى المديرين.</p>
  ${cm.map(c=>{const gi=S.comments.indexOf(c);return `<div class="row sb" style="padding:12px 0;border-bottom:1px solid var(--ls)">
    <div style="flex:1;min-width:240px">${c.rev?'':`<div class="note r" style="margin:0 0 6px">${ic('alert')}<span>يحتوي اسماً — لا يُنشر قبل الحجب</span></div>`}${esc(c.t)}<div style="margin-top:4px"><span class="tag">${c.c}</span> <span class="tag">${c.topic}</span></div></div>
    ${c.rev?`<span class="st done">${ic('check')}جاهز للنشر</span>`:`<button class="btn sm" onclick="S.comments[${gi}].t=S.comments[${gi}].t.replace('[اسم المدير]','[محجوب]');S.comments[${gi}].rev=true;render();toast('تم حجب الاسم')">حجب الاسم</button>`}</div>`}).join('')||empty('search','لا تعليقات لهذه المدينة')}
 </div>`}`;
};

/* ---------- HR: inbox ---------- */
V.inbox=()=>{
 const f=S.filter,q=S.q.trim();
 let list=S.complaints.filter(c=>f==='all'||(f==='sens'?c.sens:f==='open'?c.st!=='closed':c.st==='closed'));
 if(q)list=list.filter(c=>(c.id+c.cat+c.city+c.text).includes(q));
 list=list.slice().sort((a,b)=>rank(a)-rank(b));
 const sel=S.complaints.find(c=>c.id===S.sel);
 const cnt=k=>S.complaints.filter(c=>k==='all'||(k==='sens'?c.sens:k==='open'?c.st!=='closed':c.st==='closed')).length;
 return `
 ${head('الشكاوى','صندوق الشكاوى','تُوجَّه كل شكوى تلقائياً حسب حساسيتها، وتُحجب عمّن بينه وبين المشكو عليه تعارض مصالح.')}
 <div class="row sb" style="margin-bottom:14px">
  <div class="seg" role="group" aria-label="تصفية">${[['all','الكل'],['open','المفتوحة'],['sens','الحساسة'],['closed','المغلقة']].map(([k,t])=>`<button aria-pressed="${f===k}" onclick="S.filter='${k}';render()">${t} <span class="num" style="opacity:.7">${arN(cnt(k))}</span></button>`).join('')}</div>
  <div style="flex:1;max-width:320px;min-width:200px"><label class="sr" for="q">بحث</label><input id="q" type="search" placeholder="ابحث بالرقم أو النوع أو المدينة…" value="${esc(S.q)}" oninput="rq(this.value)"></div>
 </div>
 <div class="split">
  <div class="card" style="padding:6px 10px"><div class="tbl">
   ${list.length?`<table><tr><th>الشكوى</th><th>المدينة</th><th>الحالة</th></tr>
   ${list.map(c=>`<tr class="click ${c.id===S.sel?'sel':''}" tabindex="0" role="button" aria-label="فتح ${c.cat}" onclick="S.sel='${c.id}';render()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();S.sel='${c.id}';render()}">
    <td><b>${c.cat}</b>${c.sens?` <span class="st rush" style="padding:0 6px;font-size:11px">حساسة</span>`:''}<div class="hint"><span class="num">${c.id}</span> · ${c.mode} · قبل ${arN(c.age)} يوم</div></td><td>${c.city}</td><td>${isLate(c)?status('late'):status(c.st)}</td></tr>`).join('')}
   </table>`:empty('inbox','لا نتائج','غيّر التصفية أو كلمة البحث.')}
  </div></div>
  <div class="stick">${sel?detail(sel):empty('inbox','اختر شكوى','تظهر هنا التفاصيل والمراسلة والإجراءات.')}</div>
 </div>`;
};
function rq(v){S.q=v;render();const e=$('#q');e.focus();e.setSelectionRange(v.length,v.length)}
function detail(c){
 const nx=NEXT[c.st];
 const label={review:'بدء الدراسة',inv:'فتح تحقيق',wait:'طلب إفادة من المشتكي'}[nx];
 return `<div class="card">
  <div class="row sb"><h2 style="margin:0">${c.cat}</h2>${isLate(c)?status('late'):status(c.st)}</div>
  <div class="hint"><span class="num">${c.id}</span> · ${c.city} · قُدّمت ${c.mode}${c.who?' ('+c.who+')':''}</div>
  <div class="note ${c.sens?'r':''}" style="margin-top:12px">${ic('flag')}<span><b>التوجيه:</b> ${c.route}${c.sens?'<br>مخفية عن HR المدينة والمدير المباشر.':''}</span></div>
  ${c.sla&&c.st!=='closed'?`<div class="note r">${ic('clock')}<span>مهلة تأكيد الاستلام: متبقٍ <b class="num">${arN(c.sla)}</b> ساعة.</span></div>`:''}
  <p style="margin:12px 0">${esc(c.text)}</p>
  ${c.notes.map(n=>`<div class="note">${ic('lock')}<span><b>ملاحظة داخلية:</b> ${esc(n)}</span></div>`).join('')}
  <h2>المسار</h2>
  <ul class="tl">${c.tl.map((t,i)=>`<li class="${i===c.tl.length-1?'now':''}">${t[0]}<small>${t[1]}</small></li>`).join('')}</ul>
  <h2>المراسلة مع المشتكي ${c.mode==='مجهولة'?'<span class="tag">عبر رقم المتابعة، الهوية محفوظة</span>':''}</h2>
  ${c.msgs.map(m=>`<div class="msg ${m.from==='hr'?'hr':'me'}"><small>${m.from==='hr'?'HR':'المشتكي'}</small>${esc(m.t)}</div>`).join('')||'<p class="hint">لا رسائل بعد.</p>'}
  <form class="row" style="margin-top:8px;flex-wrap:nowrap" onsubmit="reply('${c.id}');return false"><label class="sr" for="reply">رد</label><input type="text" id="reply" placeholder="اكتب رداً للمشتكي…"><button class="btn p sm" type="submit">${ic('send')}إرسال</button></form>
  <hr>
  <div class="row">
   ${c.st!=='closed'?`<button class="btn p" onclick="adv('${c.id}')" ${nx?'':'disabled'}>${label||'—'}</button><button class="btn" onclick="askClose('${c.id}')">${ic('check')}قرار وإغلاق</button>`:`<span class="hint">${ic('check')} أُغلقت — القرار محفوظ في السجل.</span>`}
   <button class="btn q" onclick="noteC('${c.id}')">+ ملاحظة داخلية</button>
  </div>
  <p class="hint" style="margin-top:10px">${ic('eye')} كل فتح أو تعديل يُسجَّل في سجل التدقيق (من، ماذا، متى).</p>
 </div>`;
}
function adv(id){const c=S.complaints.find(x=>x.id===id),n=NEXT[c.st];if(!n)return;c.st=n;c.tl.push([{review:'قيد الدراسة',inv:'فتح تحقيق',wait:'طُلبت إفادة من المشتكي',}[n]||'تحقيق','الآن']);render();toast('تم تحديث الحالة')}
function askClose(id){ask(`<h2>إغلاق الشكوى؟</h2><p>سيُشعَر المشتكي برقم المتابعة بالقرار. يمكنك فتحها من جديد لاحقاً، وسيبقى السجل كاملاً.</p>`,()=>{const c=S.complaints.find(x=>x.id===id);c.st='closed';c.sla=0;c.tl.push(['قرار وإغلاق','الآن']);render();toast('أُغلقت الشكوى وأُشعر المشتكي')},'إغلاق')}
function noteC(id){const c=S.complaints.find(x=>x.id===id);c.notes.push('ملاحظة جديدة من سارة — مرئية لفريق التحقيق فقط.');render()}
function reply(id){const v=$('#reply').value.trim();if(!v)return;S.complaints.find(x=>x.id===id).msgs.push({from:'hr',t:v});render();toast('وصل الرد للمشتكي')}

/* ---------- volunteer: survey ---------- */
V.vsurvey=()=>{
 const qs=S.questions;
 if(S.done)return `<div class="card" style="max-width:640px;margin:20px auto;text-align:center;padding:36px">
   <div class="big-ic">${ic('check')}</div><h1 style="font-size:24px">شكراً لكِ يا لانا</h1>
   <p>${S.settings.anon==='anon'?'إجاباتك مجهولة تماماً ولا يمكن ربطها بكِ.':'إجاباتك مسجّلة باسمك.'}</p>
   <p class="hint">سنعرض عليكِ ما تغيّر بفضل الملاحظات في «قلتم… فعلنا».</p>
   <div class="row" style="justify-content:center;margin-top:12px"><button class="btn p" onclick="go('vhome')">العودة للرئيسية</button><button class="btn q" onclick="S.done=false;S.surveyStep=0;S.answers={};render()">إعادة التجربة</button></div></div>`;
 const i=S.surveyStep,q=qs[i];
 if(!q)return empty('edit','لا أسئلة في الاستبيان','أضف أسئلة من منشئ الاستبيان.');
 const a=S.answers[q.id],pct=Math.round(i/qs.length*100),last=i===qs.length-1;
 let inp='';
 if(q.type==='rating')inp=`<div class="scale" role="group" aria-label="التقييم">${[1,2,3,4,5].map(n=>`<button aria-pressed="${a===n}" onclick="ans(${q.id},${n})">${arN(n)}</button>`).join('')}</div><div class="ends"><span>لا أوافق بشدة</span><span>أوافق بشدة</span></div><div class="kbd" style="margin-top:8px">اختصار: اضغطي ١–٥ على لوحة المفاتيح</div>`;
 else if(q.type==='enps')inp=`<div class="scale n" role="group" aria-label="من صفر إلى عشرة">${[...Array(11).keys()].map(n=>`<button aria-pressed="${a===n}" onclick="ans(${q.id},${n})">${arN(n)}</button>`).join('')}</div><div class="ends"><span>غير محتمل أبداً</span><span>محتمل جداً</span></div>`;
 else if(q.type==='yesno')inp=`<div class="scale">${['نعم','لا'].map(n=>`<button style="width:auto;padding:0 28px" aria-pressed="${a===n}" onclick="ans(${q.id},'${n}')">${n}</button>`).join('')}</div>`;
 else if(q.type==='choice')inp=['خيار أول','خيار ثانٍ','خيار ثالث'].map(n=>`<button class="opt" role="radio" aria-checked="${a===n}" onclick="ans(${q.id},'${n}')"><span class="rad"></span><b>${n}</b></button>`).join('');
 else inp=`<label class="sr" for="ta">إجابتك</label><textarea id="ta" placeholder="اكتبي ما تريدين… (اختياري)" oninput="S.answers[${q.id}]=this.value">${esc(a||'')}</textarea><p class="hint">لا تذكري أسماء أشخاص؛ سيراجع HR تعليقك قبل أن يراه أحد.</p>`;
 const follow=q.type==='rating'&&a!==undefined&&a<=2?`<div class="note" style="margin-top:16px;flex-direction:column"><b>سؤال متابعة (لأن إجابتك منخفضة):</b><textarea style="min-height:80px" placeholder="ما الذي جعلك تشعرين بذلك؟ (اختياري)"></textarea></div>`:'';
 return `<div style="max-width:680px;margin:0 auto">
  <div class="note" style="margin-bottom:14px">${ic('lock')}<span>${S.settings.anon==='anon'?'هذا الاستبيان <b>مجهول الهوية</b>: لا يُحفظ ما يربط إجاباتك باسمك.':'هذا الاستبيان <b>مسمّى</b>: يعرف HR هويتك.'}</span></div>
  <div class="row sb"><b>${esc(S.settings.name)}</b><span class="hint num">${arN(i+1)} / ${arN(qs.length)}</span></div>
  <div class="prog-bar" style="margin:8px 0 18px" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
  <div class="card"><h1 style="font-size:22px;margin-bottom:18px">${esc(q.text)}</h1>${inp}${follow}</div>
  <div class="row sb" style="margin-top:14px">
   <button class="btn" ${i===0?'disabled':''} onclick="S.surveyStep--;render()">السابق</button>
   <div class="row"><span class="hint">${q.type==='text'?'اختياري':''}</span><button class="btn p" id="nextBtn" ${q.type==='text'||a!==undefined?'':'disabled'} onclick="${last?'finish()':'S.surveyStep++;render()'}">${last?'إرسال':'التالي'}</button></div>
  </div></div>`;
};
function ans(id,v){
 S.answers[id]=v;render();
 const q=S.questions[S.surveyStep];
 if(q.type==='text'||(q.type==='rating'&&v<=2))return; // low scores wait for the follow-up
 const st=S.surveyStep;clearTimeout(ans.t);
 ans.t=setTimeout(()=>{if(S.view==='vsurvey'&&S.surveyStep===st&&!S.done){st<S.questions.length-1?(S.surveyStep++,render()):null}},380);
}
function finish(){S.done=true;render();renderNav()}
document.addEventListener('keydown',e=>{
 if(S.view!=='vsurvey'||S.done||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
 const q=S.questions[S.surveyStep];if(!q)return;
 const d='٠١٢٣٤٥٦٧٨٩'.indexOf(e.key);const k=d>=0?d:/\d/.test(e.key)?+e.key:-1;
 if(q.type==='rating'&&k>=1&&k<=5)ans(q.id,k);
 if(q.type==='enps'&&k>=0&&k<=9)ans(q.id,k);
});

/* ---------- volunteer: complaint (3 steps) ---------- */
const CATS=[['مخالفة مالية أو فساد','sens'],['تحرش أو تمييز أو تنمّر','sens'],['حماية وسلامة (Safeguarding)','sens'],['خلاف مع المدير'],['الراتب والدفع'],['ظروف العمل والسلامة'],['اقتراح'],['أخرى']];
const MODES=[['named','باسمي','يعرف HR هويتي ويمكنه التواصل معي مباشرة.'],['conf','سرّية','يعرف HR وحده هويتي. لا يراها المدير ولا زملائي.'],['anon','مجهولة تماماً','لا تُحفظ أي بيانات عني. أتابع الشكوى برقم المتابعة فقط.']];
const F={step:0,cat:'',mode:'conf',text:'',file:false,tried:false};
const STEPS=['النوع','الخصوصية','التفاصيل'];
V.vcomplaint=()=>{
 if(S.newCode)return `<div class="card" style="max-width:640px;margin:20px auto;text-align:center;padding:32px">
  <div class="big-ic">${ic('check')}</div><h1 style="font-size:24px">استلمنا شكواكِ</h1>
  <p>احتفظي بهذا الرقم لمتابعة الشكوى والرد على أسئلة المحقق${F.mode==='anon'?' دون كشف هويتك':''}:</p>
  <div class="code" id="code">${S.newCode}</div>
  <div style="margin-top:10px"><button class="btn sm" onclick="navigator.clipboard&&navigator.clipboard.writeText('${S.newCode}');toast('تم نسخ الرقم')">${ic('copy')}نسخ الرقم</button></div>
  <p class="hint" style="margin-top:14px">سنؤكد الاستلام خلال ${arN(48)} ساعة. لن نطلب منكِ كشف هويتك.</p>
  <div class="row" style="justify-content:center;margin-top:12px"><button class="btn p" onclick="S.trackCode=S.newCode;go('vtrack')">متابعة الشكوى</button><button class="btn q" onclick="resetF();render()">شكوى أخرى</button></div></div>`;
 const sens=(CATS.find(c=>c[0]===F.cat)||[])[1]==='sens';
 const st=F.step;
 let body='';
 if(st===0)body=`<h2>ما نوع ما تريدين إبلاغنا عنه؟</h2><div class="grid g2" style="gap:8px" role="radiogroup">${CATS.map(([c,s])=>`<button class="opt" style="margin:0" role="radio" aria-checked="${F.cat===c}" onclick="F.cat='${c}';render()"><span class="rad"></span><b>${c}</b></button>`).join('')}</div>
  ${sens?`<div class="note r" style="margin-top:12px">${ic('alert')}<span>نوع حساس: يُوجَّه مباشرة إلى HR سوريا والمدير العام، ولا يراه HR مدينتك ولا مديرك.</span></div>`:''}`;
 if(st===1)body=`<h2>كيف تريدين أن تُقدَّم؟</h2><div role="radiogroup">${MODES.map(([k,t,d])=>`<button class="opt" role="radio" aria-checked="${F.mode===k}" onclick="F.mode='${k}';render()"><span class="rad"></span><div><b>${t}</b><span class="d">${d}</span></div></button>`).join('')}</div>
  <p class="hint">${ic('lock')} لن يُتخذ بحقك أي إجراء بسبب شكوى مقدَّمة بحسن نية.</p>`;
 if(st===2){const short=F.text.trim().length<10;body=`<h2>ماذا حدث؟</h2>
  <label class="sr" for="ftext">تفاصيل الشكوى</label>
  <textarea id="ftext" placeholder="اذكري ما حدث، ومتى، وأين، ومن كان حاضراً إن أمكن." oninput="F.text=this.value;upd()">${esc(F.text)}</textarea>
  <div class="row sb"><span class="err" id="ferr">${F.tried&&short?'اكتبي ١٠ أحرف على الأقل.':''}</span><span class="hint num" id="fcnt">${arN(F.text.length)} حرف</span></div>
  <div class="row" style="margin-top:8px"><button class="btn sm" onclick="F.file=!F.file;render()">${ic('clip')}${F.file?'صورة.jpg — إزالة':'إرفاق ملف'}</button><span class="hint">صور أو مستندات أو تسجيلات على تخزين خاص.</span></div>
  <hr><h2 style="font-size:15px">مراجعة قبل الإرسال</h2>
  <div class="hint">النوع: <b>${F.cat}</b> · الخصوصية: <b>${MODES.find(m=>m[0]===F.mode)[1]}</b>${F.file?' · مرفق: ١':''}</div>`}
 return `<div style="max-width:720px;margin:0 auto">
 ${head('أنا','تقديم شكوى أو اقتراح','صوتك مسموع وحمايتك أولوية.')}
 <ol class="steps" aria-label="الخطوات">${STEPS.map((t,i)=>`<li class="${i<st?'ok':i===st?'cur':''}" ${i===st?'aria-current="step"':''}><span>${i<st?ic('check'):arN(i+1)}</span><b>${t}</b></li>`).join('')}</ol>
 <div class="card">${body}
  <hr><div class="row sb">
   <button class="btn" ${st===0?'disabled':''} onclick="F.step--;render()">السابق</button>
   ${st<2?`<button class="btn p" ${st===0&&!F.cat?'disabled':''} onclick="F.step++;render()">التالي</button>`:`<button class="btn p" id="sb" onclick="submitC()">إرسال الشكوى</button>`}
  </div></div></div>`;
};
function upd(){$('#fcnt').textContent=arN(F.text.length)+' حرف';if(F.text.trim().length>=10)$('#ferr').textContent=''}
function resetF(){S.newCode=null;Object.assign(F,{step:0,cat:'',mode:'conf',text:'',file:false,tried:false})}
function submitC(){
 if(F.text.trim().length<10){F.tried=true;render();$('#ftext').focus();return}
 const rnd=n=>[...Array(n)].map(()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
 const code=`HC-${rnd(4)}-${Math.floor(10+Math.random()*89)}`;
 const sens=(CATS.find(c=>c[0]===F.cat)||[])[1]==='sens';
 S.complaints.unshift({id:code,cat:F.cat,mode:{named:'مسمّاة',conf:'سرّية',anon:'مجهولة'}[F.mode],who:F.mode==='named'?'لانا عبدو — متطوعة':undefined,city:'حلب',st:sens?'rush':'new',sens,age:0,sla:sens?2:48,route:sens?'HR سوريا + المدير العام':'HR حلب',text:F.text,tl:[['استلام الشكوى','الآن']].concat(sens?[['توجيه تلقائي: حساسة','الآن']]:[]),msgs:[],notes:[]});
 S.newCode=code;render();
}

/* ---------- volunteer: track ---------- */
V.vtrack=()=>{
 const code=(S.trackCode||'').toUpperCase().trim(),c=S.complaints.find(x=>x.id===code);
 return `<div style="max-width:680px;margin:0 auto">${head('أنا','متابعة شكوى','أدخلي رقم المتابعة الذي حصلتِ عليه عند التقديم. لا حاجة لتسجيل الدخول.')}
 <form class="card" onsubmit="doTrack();return false"><label class="f" for="tc">رقم المتابعة</label><div class="row" style="flex-wrap:nowrap"><input type="text" id="tc" style="direction:ltr;text-align:left" placeholder="HC-XXXX-00" value="${esc(S.trackCode)}" autocomplete="off"><button class="btn p" type="submit">${ic('search')}بحث</button></div>
 <p class="hint" style="margin:10px 0 0">للتجربة: ${S.complaints.slice(0,3).map(x=>`<a href="#" onclick="S.trackCode='${x.id}';render();return false" style="direction:ltr;display:inline-block;margin-inline-end:8px">${x.id}</a>`).join('')}</p></form>
 ${code&&!c?`<div class="note r" style="margin-top:14px">${ic('alert')}<span>لا توجد شكوى بهذا الرقم. تأكدي من الرقم وحاولي مجدداً.</span></div>`:''}
 ${c?`<div class="card" style="margin-top:14px">
  <div class="row sb"><h2 style="margin:0">${c.cat}</h2>${c.st==='rush'?status('new'):status(c.st)}</div>
  <h2 style="margin-top:16px">آخر المستجدات</h2>
  <ul class="tl">${c.tl.filter(t=>!t[0].startsWith('توجيه')).map((t,i,a)=>`<li class="${i===a.length-1?'now':''}">${t[0]}<small>${t[1]}</small></li>`).join('')}</ul>
  <h2>رسائل من HR</h2>
  ${c.msgs.map(m=>`<div class="msg ${m.from==='hr'?'hr':'me'}"><small>${m.from==='hr'?'HR':'أنتِ'}</small>${esc(m.t)}</div>`).join('')||'<p class="hint">لا رسائل جديدة.</p>'}
  <form class="row" style="margin-top:8px;flex-wrap:nowrap" onsubmit="trReply('${c.id}');return false"><label class="sr" for="tr">ردك</label><input type="text" id="tr" placeholder="اكتبي رداً…"><button class="btn sm p" type="submit">${ic('send')}إرسال</button></form>
  <p class="hint" style="margin-top:10px">${ic('lock')} المحقق لا يرى هويتك${c.mode==='مجهولة'?' — لم تُحفظ أصلاً':''}.</p></div>`:''}</div>`;
};
function doTrack(){S.trackCode=$('#tc').value;render()}
function trReply(id){const v=$('#tr').value.trim();if(!v)return;S.complaints.find(x=>x.id===id).msgs.push({from:'me',t:v});render();toast('وصل ردّك للمحقق دون كشف هويتك')}

/* ---------- render ---------- */
function render(){renderNav();$('#view').innerHTML=V[S.view]()}
document.addEventListener('click',e=>{
 const n=e.target.closest('#nav button');if(n)go(n.dataset.v);
 const r=e.target.closest('#roleSeg button');if(r)setRole(r.dataset.r);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav()});
render();
</script>
</body>
</html>
