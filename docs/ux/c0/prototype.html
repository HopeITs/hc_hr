<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C0 menu prototype</title>
<!--
  C0 prototype (docs/ux/interaction-contract.md §9). Static and synthetic:
  no app code, no real names, no pay. Open the file in a browser.
  Switch language, role and width in the bar at the top.
-->
<style>
  @font-face { font-family: 'SomarSans'; src: url('../../../resources/fonts/SomarSans/SomarSans-Regular.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'SomarSans'; src: url('../../../resources/fonts/SomarSans/SomarSans-Bold.woff2') format('woff2'); font-weight: 700; }
  :root {
    --color-primary: #c2151c; --color-primary-hover: #a51218;
    --color-secondary-dark: #58595b; --color-secondary-medium: #6d6e71;
    --color-secondary-light: #939598; --color-secondary-soft: #dcddde;
    --color-neutral-50: #f7f7f8; --color-neutral-100: #eeeff0; --color-neutral-200: #dcddde; --color-neutral-300: #bcbec0;
    --bg: #f4f4f5; --surface: #fff; --text: #1d1d1f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'SomarSans', 'Lato', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }
  button, input { font: inherit; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; background: #2b2b2e; color: #fff; font-size: 13px; }
  .controls label { display: flex; gap: 6px; align-items: center; }
  .controls select { font: inherit; padding: 4px 6px; border-radius: 6px; }
  .controls .note { opacity: .75; }
  .test-btn { margin-inline-start: auto; padding: 6px 14px; border: 0; border-radius: 8px; background: var(--color-primary); color: #fff; font-weight: 700; cursor: pointer; }
  .test-panel { padding: 14px 16px; background: #fff8e6; border-bottom: 1px solid #f0d58a; }
  .test-panel h2 { margin: 0 0 6px; font-size: 18px; }
  .test-panel p { margin: 4px 0; }
  .test-panel .task { font-size: 18px; font-weight: 700; margin: 8px 0; }
  .test-panel .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
  .test-panel button, .test-panel select, .test-panel input { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--color-neutral-300); background: #fff; cursor: pointer; }
  .test-panel button.primary { background: var(--color-primary); border-color: var(--color-primary); color: #fff; font-weight: 700; }
  .test-panel .found { color: #157347; font-weight: 700; }
  .test-panel textarea { width: 100%; min-height: 140px; font: 13px/1.5 ui-monospace, monospace; direction: ltr; }
  .test-panel table { border-collapse: collapse; margin-top: 8px; background: #fff; }
  .test-panel td, .test-panel th { border: 1px solid var(--color-neutral-200); padding: 4px 8px; font-size: 13px; text-align: start; }
  .stage { display: flex; justify-content: center; padding: 16px; }
  .device { width: 100%; max-width: 1280px; height: 760px; background: var(--bg); border: 1px solid var(--color-neutral-300); border-radius: 12px; overflow: hidden; position: relative; display: flex; }
  .device.phone { max-width: 375px; height: 720px; border-radius: 28px; border-width: 8px; border-color: #2b2b2e; }

  /* Sidebar */
  .sidebar { width: 264px; flex-shrink: 0; background: var(--surface); border-inline-end: 1px solid var(--color-neutral-200); overflow-y: auto; padding: 12px; }
  .phone .sidebar { position: absolute; inset-block: 0; inset-inline-start: 0; z-index: 20; box-shadow: 0 10px 40px rgba(0,0,0,.25); transform: translateX(100%); transition: transform .25s; }
  [dir=ltr] .phone .sidebar { transform: translateX(-100%); }
  .phone.menu-open .sidebar { transform: none; }
  .scrim { display: none; }
  .phone.menu-open .scrim { display: block; position: absolute; inset: 0; background: rgba(20,20,22,.35); z-index: 10; }
  .logo { font-weight: 700; color: var(--color-primary); padding: 8px 10px 14px; border-bottom: 1px solid var(--color-neutral-100); margin-bottom: 8px; }
  .area { margin-top: 14px; }
  .area h3 { margin: 0 0 4px; padding: 0 10px; font-size: 12px; font-weight: 700; color: var(--color-secondary-light); letter-spacing: .02em; }
  .area h4 { margin: 10px 0 2px; padding: 0 10px; font-size: 12px; font-weight: 400; color: var(--color-secondary-light); }
  .nav-item { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 40px; padding: 8px 10px; border: 0; border-radius: 10px; background: none; color: var(--color-secondary-dark); text-align: start; cursor: pointer; }
  .nav-item:hover { background: var(--color-neutral-100); }
  .nav-item[aria-current=page] { background: #fbeaea; color: var(--color-primary); font-weight: 700; }
  .nav-item.inbox { font-weight: 700; color: var(--text); border: 1px solid var(--color-neutral-200); }
  .count { min-width: 22px; padding: 1px 7px; border-radius: 999px; background: var(--color-primary); color: #fff; font-size: 12px; font-weight: 700; text-align: center; }
  .soon { font-size: 11px; color: var(--color-secondary-light); }

  /* Main */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--color-neutral-200); }
  .icon-btn { width: 40px; height: 40px; border: 0; border-radius: 12px; background: var(--color-neutral-100); cursor: pointer; display: grid; place-items: center; color: var(--color-secondary-dark); flex-shrink: 0; }
  .burger { display: none; }
  .phone .burger { display: grid; }
  .search { position: relative; flex: 1; max-width: 420px; }
  .search input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--color-neutral-300); border-radius: 12px; background: var(--color-neutral-50); }
  .search input:focus { outline: 2px solid var(--color-primary); outline-offset: 1px; background: #fff; }
  .results, .menu { position: absolute; top: 46px; inset-inline-start: 0; z-index: 30; width: 100%; min-width: 240px; background: #fff; border: 1px solid var(--color-neutral-200); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.15); padding: 6px; }
  .results h5 { margin: 6px 8px 2px; font-size: 12px; color: var(--color-secondary-light); font-weight: 700; }
  .result { display: block; width: 100%; padding: 8px; border: 0; border-radius: 8px; background: none; text-align: start; cursor: pointer; }
  .result:hover { background: var(--color-neutral-100); }
  .result small { display: block; color: var(--color-secondary-medium); }
  .new-wrap { position: relative; }
  .new-btn { height: 40px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--color-primary); color: #fff; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .new-btn:hover { background: var(--color-primary-hover); }
  .menu { width: 220px; inset-inline-start: auto; inset-inline-end: 0; }
  .phone .search { max-width: none; }
  .phone .lang, .phone .bell { display: none; }
  .spacer { flex: 1; }
  .phone .spacer { display: none; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--color-primary); background: #e8d9d9; flex-shrink: 0; }
  .content { flex: 1; overflow-y: auto; padding: 18px; }
  .content h1 { margin: 0 0 4px; font-size: 22px; }
  .crumb { color: var(--color-secondary-light); font-size: 13px; margin-bottom: 14px; }
  .note-box { border: 1px dashed var(--color-neutral-300); border-radius: 12px; padding: 12px; color: var(--color-secondary-medium); background: #fff; font-size: 13px; margin-bottom: 14px; }
  .focus { background: #fff; border: 1px solid var(--color-neutral-200); border-inline-start: 4px solid var(--color-primary); border-radius: 14px; padding: 6px 14px; margin-bottom: 14px; }
  .focus h2 { margin: 8px 0 4px; font-size: 15px; color: var(--color-secondary-medium); }
  .focus-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--color-neutral-100); font-weight: 700; }
  .focus-row:first-of-type { border-top: 0; }
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .phone .cards { grid-template-columns: 1fr; }
  .card { background: #fff; border-radius: 14px; padding: 14px; min-height: 96px; box-shadow: 0 0 25px -14px rgba(0,0,0,.3); color: var(--color-secondary-dark); font-weight: 700; }
  .card small { display: block; font-weight: 400; color: var(--color-secondary-light); margin-top: 6px; }
  .row > div:first-child { flex: 1 1 180px; min-width: 0; }
  .row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; box-shadow: 0 0 25px -16px rgba(0,0,0,.3); }
  .row small { display: block; color: var(--color-secondary-medium); }
  .pill { white-space: nowrap; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #fff4e0; color: #8a5a00; }
  .btn-sm { padding: 6px 12px; border-radius: 10px; border: 1px solid var(--color-primary); background: #fff; color: var(--color-primary); font-weight: 700; cursor: pointer; white-space: nowrap; }
</style>
</head>
<body>
<div class="controls">
  <label><span data-t="ctl.lang"></span>
    <select id="lang"><option value="ar">العربية</option><option value="en">English</option></select></label>
  <label><span data-t="ctl.role"></span><select id="role"></select></label>
  <label><span data-t="ctl.width"></span>
    <select id="width"><option value="desktop">Desktop</option><option value="phone">Phone 375</option></select></label>
  <span class="note" data-t="ctl.note"></span>
  <button type="button" id="testStart" class="test-btn"></button>
</div>
<div class="test-panel" id="testPanel" hidden></div>

<div class="stage">
  <div class="device" id="device">
    <div class="scrim" id="scrim"></div>
    <nav class="sidebar" id="sidebar" aria-label="menu"></nav>
    <div class="main">
      <header class="header">
        <button class="icon-btn burger" id="burger" aria-label="menu">☰</button>
        <div class="search">
          <input id="q" type="search" autocomplete="off">
          <div class="results" id="results" hidden></div>
        </div>
        <div class="new-wrap">
          <button class="new-btn" id="newBtn" aria-haspopup="menu" aria-expanded="false"></button>
          <div class="menu" id="newMenu" role="menu" hidden></div>
        </div>
        <span class="spacer"></span>
        <button class="icon-btn lang" aria-hidden="true">EN | AR</button>
        <button class="icon-btn bell" aria-hidden="true">🔔</button>
        <span class="avatar" aria-hidden="true"></span>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>
</div>

<script>
/*

      gm: [['طلب واحد ينتظر قراري', 'فتح صندوق المهام'], ['عقود تنتهي خلال 30 يوماً: 7', 'عرض']],

      hr: [['قرار للمراجعة', 'رنا · مقبول من المدير', 'seen'], ['قرار للمراجعة', 'زينة · مرفوض من المدير', 'seen'], ['تأكيد عهدة', 'حاسوب محمول · تسليم', 'confirm'], ['تأكيد عهدة', 'بطاقة دخول · استرجاع', 'confirm'], ['قرار للمراجعة', 'هالة · مقبول من المدير', 'seen']],
    },
    people: [['سارة حداد', 'منسقة برنامج · مركز حلب 1 · حلب'], ['نبيل صليبا', 'مدرّس · مركز حمص · حمص'], ['رنا ضاهر', 'محاسبة · المكتب الرئيسي · دمشق']],

  en: {

    inbox: 'Work inbox', mySpace: 'My space', org: 'Organisation', myTeam: 'My team', hr: 'HR operations', settings: 'Settings',

      manager: [['3 requests need my decision', 'Open work inbox'], ['Off this week in my team: 2', 'View'], ['My balance: 18 days', 'Request leave']],
      gm: [['1 request needs my decision', 'Open work inbox'], ['Contracts ending in 30 days: 7', 'View']],
      hr: [['5 items in the work inbox', 'Open work inbox'], ['Contracts ending in 30 days: 4', 'View'], ['Incomplete or awaiting-contract employees: 3', 'View']],

/* Menu per role (§4). Items follow the permissions each role holds today. */
// C0-Q4: nothing is hidden; reference pages sit under My space › Organisation.
const ORG_READ = ['directory', 'centers', 'programs', 'positions', 'basics'];
const MY = ['home', 'myLeaves', 'myItems', 'myFiles', 'sharedFiles'];
const HR_OPS = ['employees', 'contracts', 'leaveRequests', 'balances', 'positions', 'programs', 'centers', 'deliverables', 'doneChecklist', 'badges', 'news', 'stats'];
const ROLES = {
  employee: { label: { ar: 'موظف', en: 'Employee' }, focus: 'employee', inbox: null, areas: [['mySpace', MY, ORG_READ]], new: ['new.leave'] },
  manager: { label: { ar: 'مدير', en: 'Manager' }, focus: 'manager', inbox: 'manager', areas: [['mySpace', MY, ORG_READ], ['myTeam', ['teamLeaves', 'teamCalendar', 'teamContracts', 'handOut', 'takeBack']]], new: ['new.leave', 'new.news'] },
  gm: { label: { ar: 'المدير العام', en: 'General manager' }, focus: 'gm', inbox: 'manager', areas: [['mySpace', MY, ['directory', 'centers', 'positions', 'basics']], ['hr', ['employees', 'contracts', 'leaveRequests', 'programs', 'deliverables', 'doneChecklist', 'badges', 'news', 'stats']]], new: ['new.leave', 'new.employee', 'new.contract', 'new.news'] },
  hrRegional: { label: { ar: 'موارد بشرية (حلب)', en: 'Regional HR (Aleppo)' }, focus: 'hr', inbox: 'hr', areas: [['mySpace', MY, ['directory', 'basics']], ['hr', HR_OPS]], new: ['new.leave', 'new.employee', 'new.contract', 'new.news'] },
  hrNational: { label: { ar: 'موارد بشرية مركزية', en: 'Nationwide HR' }, focus: 'hr', inbox: 'hr', areas: [['mySpace', MY, ['directory']], ['hr', HR_OPS], ['settings', ['basics', 'access', 'activity']]], new: ['new.leave', 'new.employee', 'new.contract', 'new.news'] },
  admin: { label: { ar: 'مدير النظام', en: 'Administrator' }, focus: 'admin', inbox: 'hr', areas: [['mySpace', MY, ['directory']], ['hr', HR_OPS], ['settings', ['basics', 'access', 'activity']]], new: ['new.leave', 'new.employee', 'new.news'] },
};

/* What each "For you now" button stands for, in order (the test recognises them by these ids). */
const FOCUS_IDS = {
  employee: ['leave', 'requests', 'items'],
  manager: ['inbox', 'teamOff', 'leave'],
  gm: ['inbox', 'contractsEnding'],
  hr: ['inbox', 'contractsEnding', 'incomplete'],
  admin: ['inbox', 'settings'],
};

const state = { lang: 'ar', role: 'manager', width: 'desktop', page: 'home', area: 'mySpace' };
const $ = (id) => document.getElementById(id);
const t = (k) => T[state.lang][k] ?? k;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function navButton(key, area) {
  const current = state.page === key && state.area === area ? ' aria-current="page"' : '';
  const soon = key === 'teamCalendar' ? ` <span class="soon">${t('soon')}</span>` : '';
  return `<button class="nav-item" data-page="${key}" data-area="${area}"${current}><span>${esc(t(key))}${soon}</span></button>`;
}

function renderSidebar() {
  const role = ROLES[state.role];
  let html = `<div class="logo">HOPE · HR</div>`;
  if (role.inbox) {
    const n = T[state.lang].inboxRows[role.inbox].length;
    const current = state.page === 'inbox' ? ' aria-current="page"' : '';
    html += `<button class="nav-item inbox" data-page="inbox" data-area="inbox"${current}><span>${esc(t('inbox'))}</span><span class="count" aria-label="${n}">${n}</span></button>`;
  }
  for (const [area, items, org] of role.areas) {
    html += `<div class="area"><h3>${esc(t(area))}</h3>${items.map((k) => navButton(k, area)).join('')}`;
    if (org && org.length) html += `<h4>${esc(t('org'))}</h4>${org.map((k) => navButton(k, 'org')).join('')}`;
    html += `</div>`;
  }
  $('sidebar').innerHTML = html;
}

function renderContent() {
  const role = ROLES[state.role];
  let html;
  if (state.page === 'home') {
    // C0-Q5: one ordered block for the active role on top, the existing cards below.
    const focus = T[state.lang].focus[role.focus];
    const target = role.inbox ? ['inbox', 'inbox'] : ['myLeaves', 'mySpace'];
    html = `<h1>${esc(t('home'))}</h1><div class="crumb">${esc(t('mySpace'))}</div>
      <section class="focus"><h2>${esc(t('forYou'))}</h2>` +
      focus.map(([text, action], i) => `<div class="focus-row"><span>${esc(text)}</span>
        <button class="btn-sm" data-focus="${FOCUS_IDS[role.focus][i]}" ${i === 0 ? `data-page="${target[0]}" data-area="${target[1]}"` : ''}>${esc(action)}</button></div>`).join('') +
      `</section>
      <div class="note-box">${esc(t('homeNote'))}</div>
      <div class="cards">${T[state.lang].cards.map((c) => `<div class="card">${esc(c)}<small>—</small></div>`).join('')}</div>`;
  } else if (state.page === 'inbox') {
    const rows = T[state.lang].inboxRows[role.inbox];
    html = `<h1>${esc(t('inbox'))}</h1><div class="crumb">${esc(t('inboxNote'))}</div>` +
      rows.map(([title, sub, action]) => `<div class="row"><div><strong>${esc(title)}</strong><small>${esc(sub)}</small></div>
        <div style="display:flex;gap:8px;align-items:center"><span class="pill">${esc(t('pending'))}</span><button class="btn-sm">${esc(t(action))}</button></div></div>`).join('');
  } else {
    const areaName = state.area === 'org' ? `${t('mySpace')} › ${t('org')}` : t(state.area);
    html = `<h1>${esc(t(state.page))}</h1><div class="crumb">${esc(areaName)}</div><div class="note-box">${esc(t('pageNote'))}</div>`;
  }
  $('content').innerHTML = html;
}

function renderNew() {
  const items = ROLES[state.role].new;
  $('newBtn').textContent = '+ ' + t('new');
  $('newMenu').innerHTML = items.map((k) => `<button class="result" role="menuitem" data-new="${k}">${esc(t(k))}</button>`).join('');
}

function renderSearch() {
  const q = $('q').value.trim().toLowerCase();
  const box = $('results');
  if (!q) { box.hidden = true; return; }
  const role = ROLES[state.role];
  const pages = [];
  if (role.inbox) pages.push(['inbox', 'inbox']);
  for (const [area, items, org] of role.areas) {
    items.forEach((k) => pages.push([k, area]));
    (org || []).forEach((k) => pages.push([k, 'org']));
  }
  const pageHits = pages.filter(([k]) => t(k).toLowerCase().includes(q));
  // People: directory tier only (name, position, center, city). Never pay or private fields.
  const peopleHits = [...T.ar.people, ...T.en.people].filter(([name]) => name.toLowerCase().includes(q));
  let html = '';
  if (pageHits.length) html += `<h5>${esc(t('pages'))}</h5>` + pageHits.map(([k, a]) => `<button class="result" data-page="${k}" data-area="${a}">${esc(t(k))}<small>${esc(a === 'org' ? t('org') : t(a))}</small></button>`).join('');
  if (peopleHits.length) html += `<h5>${esc(t('people'))}</h5>` + peopleHits.map(([n, sub]) => `<button class="result" data-person="1">${esc(n)}<small>${esc(sub)}</small></button>`).join('');
  box.innerHTML = html || `<div class="result">${esc(t('noResults'))}</div>`;
  box.hidden = false;
}

function render() {
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
  $('role').innerHTML = Object.entries(ROLES).map(([k, r]) => `<option value="${k}"${k === state.role ? ' selected' : ''}>${esc(r.label[state.lang])}</option>`).join('');
  $('device').className = 'device' + (state.width === 'phone' ? ' phone' : '');
  $('q').placeholder = t('search');
  renderSidebar(); renderContent(); renderNew(); renderSearch();
}

function go(page, area) {
  state.page = page; state.area = area;
  $('device').classList.remove('menu-open');
  $('results').hidden = true; $('q').value = '';
  render();
}

$('lang').addEventListener('change', (e) => { state.lang = e.target.value; render(); });
$('role').addEventListener('change', (e) => { state.role = e.target.value; state.page = 'home'; state.area = 'mySpace'; render(); });
$('width').addEventListener('change', (e) => { state.width = e.target.value; render(); });
$('burger').addEventListener('click', () => $('device').classList.toggle('menu-open'));
$('scrim').addEventListener('click', () => $('device').classList.remove('menu-open'));
$('q').addEventListener('input', renderSearch);
$('newBtn').addEventListener('click', () => {
  const open = $('newMenu').hidden;
  $('newMenu').hidden = !open;
  $('newBtn').setAttribute('aria-expanded', String(open));
});
document.addEventListener('click', (e) => {
  const target = e.target.closest('[data-page]');
  if (target) go(target.dataset.page, target.dataset.area);
  if (!e.target.closest('.new-wrap')) { $('newMenu').hidden = true; $('newBtn').setAttribute('aria-expanded', 'false'); }
  if (!e.target.closest('.search')) $('results').hidden = true;
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { $('newMenu').hidden = true; $('results').hidden = true; $('device').classList.remove('menu-open'); }
});
/*
 * Scenario check (AC-C0-03, interaction-contract.md §11). The moderator picks
 * the participant's persona and a code (P1, P2 … never a name); each task is
 * shown above the prototype, every click inside it is recorded, and the task
 * ends when the participant reaches a target or says they cannot find it.
 * Results stay in this page: "Copy results" gives tab-separated lines to paste
 * into the results sheet. Nothing is sent anywhere.
 */
const TASKS = [
  { id: 'T1', persona: 'employee', ar: 'تريد أن تطلب يوم إجازة في الأسبوع القادم. أين تضغط؟', en: 'You want a day off next week. Where do you click?', targets: ['new:new.leave', 'page:myLeaves', 'focus:leave'] },
  { id: 'T2', persona: 'employee', ar: 'تريد رقم هاتف العمل لزميل يعمل في مدينة أخرى. أين تبحث؟', en: 'You need the work phone of a colleague in another city. Where do you look?', targets: ['person', 'page:directory'] },
  { id: 'T3', persona: 'employee', ar: 'تريد أن تعرف هل ردّ مديرك على طلب إجازتك. أين تضغط؟', en: 'Did your manager answer your leave request? Where do you click?', targets: ['page:myLeaves', 'focus:requests'] },
  { id: 'T4', persona: 'manager', ar: 'أحد أفراد فريقك طلب إجازة وتريد الرد عليه. أين تضغط؟', en: 'Someone in your team asked for leave. Where do you click to answer?', targets: ['page:inbox', 'focus:inbox'] },
  { id: 'T5', persona: 'manager', ar: 'تريد معرفة من من فريقك في إجازة هذا الأسبوع. أين تضغط؟', en: 'Who in your team is off this week? Where do you click?', targets: ['page:teamLeaves', 'page:teamCalendar', 'focus:teamOff'] },
  { id: 'T6', persona: 'hrRegional', ar: 'مدير قرّر طلب إجازة، وتريد تسجيل أن الموارد البشرية راجعته. أين تضغط؟', en: 'A manager decided a leave request; you want to mark it as seen by HR. Where do you click?', targets: ['page:inbox', 'focus:inbox'] },
  { id: 'T7', persona: 'hrRegional', ar: 'تريد رؤية العقود التي تنتهي هذا الشهر. أين تضغط؟', en: 'You want the contracts that end this month. Where do you click?', targets: ['page:contracts', 'focus:contractsEnding'] },
  { id: 'T8', persona: 'hrRegional', ar: 'تريد إضافة عقد جديد لموظف. أين تضغط؟', en: 'You want to add a new contract for an employee. Where do you click?', targets: ['new:new.contract', 'page:contracts'] },
  { id: 'T9', persona: 'admin', ar: 'تريد تغيير ما يُسمح لدور معيّن أن يفعله في النظام. أين تضغط؟', en: 'You want to change what a role is allowed to do. Where do you click?', targets: ['page:access'] },
];
const TT = {
  ar: { start: 'ابدأ اختبار المستخدم', title: 'اختبار المستخدم (C0)', code: 'رمز المشارك (P1، P2… بلا أسماء)', persona: 'دور المشارك', go: 'ابدأ', task: 'المهمة', of: 'من', giveUp: 'لم أجدها', next: 'المهمة التالية', found: '✓ وجدتها', done: 'انتهى الاختبار. انسخ النتائج وأرسلها.', copy: 'نسخ النتائج', copied: 'تم النسخ', close: 'إغلاق', again: 'مشارك جديد', intro: 'اقرأ المهمة للمشارك ولا تساعده. سجّل ما يقوله إن بحث عن اسم آخر.', h: ['المهمة', 'أول ضغطة', 'وجدها؟', 'ثوانٍ', 'ضغطات'] },
  en: { start: 'Start user test', title: 'User test (C0)', code: 'Participant code (P1, P2 … no names)', persona: 'Participant role', go: 'Start', task: 'Task', of: 'of', giveUp: "Can't find it", next: 'Next task', found: '✓ Found', done: 'Test finished. Copy the results and send them.', copy: 'Copy results', copied: 'Copied', close: 'Close', again: 'New participant', intro: 'Read the task aloud and do not help. Note any other word the person looks for.', h: ['Task', 'First click', 'Found?', 'Seconds', 'Clicks'] },
};
const tt = (k) => TT[state.lang][k];
const test = { on: false, code: '', persona: 'employee', tasks: [], i: 0, started: 0, clicks: [], found: false, results: [] };

function clickKey(el) {
  const hit = el.closest('[data-focus],[data-new],[data-person],[data-page],#newBtn,#burger,#q');
  if (!hit) return 'other';
  if (hit.dataset.focus) return 'focus:' + hit.dataset.focus;
  if (hit.dataset.new) return 'new:' + hit.dataset.new;
  if (hit.dataset.person) return 'person';
  if (hit.dataset.page) return 'page:' + hit.dataset.page;
  return { newBtn: 'open:new', burger: 'open:menu', q: 'open:search' }[hit.id];
}

function renderTest() {
  const panel = $('testPanel');
  $('testStart').textContent = tt('start');
  if (!test.on) { panel.hidden = true; return; }
  panel.hidden = false;
  if (!test.tasks.length) {
    panel.innerHTML = `<h2>${esc(tt('title'))}</h2><p>${esc(tt('intro'))}</p>
      <div class="actions"><label>${esc(tt('code'))} <input id="tCode" value="${esc(test.code)}" size="6"></label>
      <label>${esc(tt('persona'))} <select id="tPersona">${['employee', 'manager', 'hrRegional', 'admin'].map((k) => `<option value="${k}"${k === test.persona ? ' selected' : ''}>${esc(ROLES[k].label[state.lang])}</option>`).join('')}</select></label>
      <button class="primary" id="tGo">${esc(tt('go'))}</button><button id="tClose">${esc(tt('close'))}</button></div>`;
    return;
  }
  if (test.i >= test.tasks.length) {
    const lines = test.results.map((r) => [r.code, r.persona, r.lang, r.width, r.task, r.first, r.found ? 'Y' : 'N', r.seconds, r.clicks, r.path].join('\t'));
    panel.innerHTML = `<h2>${esc(tt('done'))}</h2>
      <table><tr>${tt('h').map((x) => `<th>${esc(x)}</th>`).join('')}</tr>${test.results.map((r) => `<tr><td>${r.task}</td><td>${esc(r.first)}</td><td>${r.found ? '✓' : '✗'}</td><td>${r.seconds}</td><td>${r.clicks}</td></tr>`).join('')}</table>
      <textarea id="tOut" readonly>${esc(['code\tpersona\tlang\twidth\ttask\tfirst_click\tfound\tseconds\tclicks\tpath', ...lines].join('\n'))}</textarea>
      <div class="actions"><button class="primary" id="tCopy">${esc(tt('copy'))}</button><button id="tAgain">${esc(tt('again'))}</button><button id="tClose">${esc(tt('close'))}</button></div>`;
    return;
  }
  const task = test.tasks[test.i];
  panel.innerHTML = `<p>${esc(tt('task'))} ${test.i + 1} ${esc(tt('of'))} ${test.tasks.length} · ${esc(test.code)}</p>
    <div class="task">${esc(task[state.lang])}</div>
    <div class="actions">${test.found ? `<span class="found">${esc(tt('found'))}</span><button class="primary" id="tNext">${esc(tt('next'))}</button>` : `<button id="tGiveUp">${esc(tt('giveUp'))}</button>`}</div>`;
}

function beginTask() {
  state.role = test.persona; state.page = 'home'; state.area = 'mySpace';
  test.started = performance.now(); test.clicks = []; test.found = false;
  $('device').classList.remove('menu-open');
  render(); renderTest();
}

function endTask(found) {
  const task = test.tasks[test.i];
  test.results.push({
    code: test.code, persona: test.persona, lang: state.lang, width: state.width, task: task.id,
    first: test.clicks[0] || '—', found, seconds: Math.round((performance.now() - test.started) / 100) / 10,
    clicks: test.clicks.length, path: test.clicks.join(' > '),
  });
}

$('testStart').addEventListener('click', () => { test.on = true; test.tasks = []; test.results = []; renderTest(); });
$('testPanel').addEventListener('click', async (e) => {
  const id = e.target.id;
  if (id === 'tGo') {
    test.code = ($('tCode').value || '').trim().slice(0, 12) || 'P?';
    test.persona = $('tPersona').value;
    test.tasks = TASKS.filter((x) => x.persona === test.persona); test.i = 0;
    beginTask();
  } else if (id === 'tGiveUp') { endTask(false); test.i++; test.i < test.tasks.length ? beginTask() : renderTest(); }
  else if (id === 'tNext') { test.i++; test.i < test.tasks.length ? beginTask() : renderTest(); }
  else if (id === 'tCopy') { try { await navigator.clipboard.writeText($('tOut').value); e.target.textContent = tt('copied'); } catch { $('tOut').select(); } }
  else if (id === 'tAgain') { test.tasks = []; test.code = ''; renderTest(); }
  else if (id === 'tClose') { test.on = false; renderTest(); }
});
// Record clicks inside the prototype before the prototype handles them.
$('device').addEventListener('click', (e) => {
  if (!test.on || !test.tasks.length || test.i >= test.tasks.length || test.found) return;
  const key = clickKey(e.target);
  test.clicks.push(key);
  if (test.tasks[test.i].targets.includes(key)) { test.found = true; endTask(true); renderTest(); }
}, true);
$('lang').addEventListener('change', renderTest);

render();
renderTest();
</script>
</body>
</html>
