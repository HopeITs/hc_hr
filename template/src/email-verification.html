<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
	<meta name="description" content="Smarthr - Bootstrap Admin Template">
	<meta name="keywords" content="admin, estimates, bootstrap, business, html5, responsive, Projects">
	<meta name="author" content="Dreams technologies - Bootstrap Admin Template">
	<meta name="robots" content="noindex, nofollow">
	<title>Smarthr Admin Template</title>

	<!-- Favicon -->
	<link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.png">

	<!-- Apple Touch Icon -->
	<link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">

	<!-- Feather CSS -->
	<link rel="stylesheet" href="assets/plugins/icons/feather/feather.css">

	<!-- Flowbite CSS -->
	<link rel="stylesheet" href="assets/css/flowbite.min.css">

	<!-- Tabler Icon CSS -->
	<link rel="stylesheet" href="assets/plugins/tabler-icons/tabler-icons.css">

	<!-- Fontawesome CSS -->
	<link rel="stylesheet" href="assets/plugins/fontawesome/css/fontawesome.min.css">
	<link rel="stylesheet" href="assets/plugins/fontawesome/css/all.min.css">

	<!-- Main CSS -->
	<link rel="stylesheet" href="../dist/style.css">

</head>

<body class="bg-white">

	<div id="global-loader" style="display: none;">
		<div class="page-loader"></div>
	</div>

	<!-- Main Wrapper -->
	<div class="main-wrapper">

		<div class="container-fuild">
			<div class="w-full overflow-hidden relative block h-screen">
				<div class="grid grid-cols-1 lg:grid-cols-12 gap-x-6">
					<div class="lg:col-span-5">
						<div class="login-background relative hidden md:flex items-center justify-center flex-wrap h-screen">
							<div class="bg-overlay-img">
								<img src="assets/img/bg/bg-01.png" class="bg-1 absolute right-0 bottom-0" alt="Img">
								<img src="assets/img/bg/bg-02.png" class="bg-2 absolute bottom-0 left-0" alt="Img">
								<img src="assets/img/bg/bg-03.png" class="bg-3 absolute right-0 top-0" alt="Img">
							</div>
							<div class="authentication-card w-full m-4 p-4">
								<div class="authen-overlay-item relative z-1 bg-primary-200 border p-8 rounded-xl w-full">
									<h1 class="text-white display-1">Empowering people <br> through seamless HR <br> management.</h1>
									<div class="my-4 mx-auto authen-overlay-img">
										<img src="assets/img/bg/authentication-bg-01.png" alt="Img">
									</div>
									<div>
										<p class="text-white fs-20 fw-semibold text-center">Efficiently manage your workforce, streamline <br> operations effortlessly.</p>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="lg:col-span-7 overflow-auto">
						<div class="max-w-md mx-auto">
							<div class="w-full h-screen ">
								<form action="reset-password.html" class="h-screen digit-group">
									<div class="h-screen flex flex-col justify-between p-6 pb-0">
										<div class=" mx-auto mb-8 text-center">
											<img src="assets/img/logo.svg"
												class="img-fluid mx-auto" alt="Logo">
										</div>
										<div class="">
											<div class="text-center mb-3">
												<h2 class="mb-2">Email OTP Verification</h2>
												<p class="mb-0">OTP sent to your Email Address ending ******doe@example.com</p>
											</div>
											<div class="mb-4 otp-input">
												<div class="flex items-center justify-center mb-3">
													<input type="email" class="bg-white border-borderColor border-2 text-gray-900 rounded-input w-full placeholder:text-gray-400  py-sm-3 py-4 text-center text-2xl font-bold me-3 " id="digit-1" name="digit-1" data-next="digit-2" maxlength="1">
													<input type="email" class="bg-white border-borderColor border-2 text-gray-900 rounded-input w-full placeholder:text-gray-400  py-sm-3 py-4 text-center text-2xl font-bold me-3"  id="digit-2" name="digit-2" data-next="digit-3" data-previous="digit-1" maxlength="1">
													<input type="email" class="bg-white border-borderColor border-2 text-gray-900 rounded-input w-full placeholder:text-gray-400  py-sm-3 py-4 text-center text-2xl font-bold me-3" id="digit-3" name="digit-3" data-next="digit-4" data-previous="digit-2" maxlength="1">
													<input type="email" class="bg-white border-borderColor border-2 text-gray-900 rounded-input w-full placeholder:text-gray-400  py-sm-3 py-4 text-center text-2xl font-bold me-3"  id="digit-4" name="digit-4" data-next="digit-5" data-previous="digit-3" maxlength="1">
												</div>
												<div class="flex items-center justify-center">
													<span class="bg-danger-transparent text-danger text-xs font-medium me-2 px-2.5 py-0.5 rounded flex items-center"><i class="ti ti-clock text-danger me-2"></i>09:59 s</span>
												</div>
											</div>
											<div class="text-center mb-4">
												<h6 class="font-normal text-dark mb-0">Didn't get the OTP? 
													<a href="login.html" class="hover-a text-primary">Resend OTP  </a>
												</h6>
											</div>
											<div class="mb-3">
												<button type="submit" class="btn btn-primary w-full bg-primary text-white">Verify & Proceed</button>
											</div>
											
										</div>
                                        <div class="mt-8 pb-4 text-center">
											<p class="mb-0 text-gray-9">Copyright &copy; 2024 - Smarthr</p>
										</div>
									</div>
								</form>
							</div>

						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- /Main Wrapper -->

	<!-- jQuery -->
	<script src="assets/js/jquery-3.7.1.min.js"></script>

	<!-- Flowbite JS -->
	<script src="assets/js/flowbite.min.js"></script>

	<!-- Feather Icon JS -->
	<script src="assets/js/feather.min.js"></script>

	<!-- Custom JS -->
	<script src="assets/js/otp.js"></script>
	<script src="assets/js/script.js"></script>

</body>

</html>
